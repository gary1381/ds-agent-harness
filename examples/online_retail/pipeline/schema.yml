models:
  transactions:
    columns:
      invoice: [not_null]
      line_type: [{accepted_values: [product, cancellation, fee, adjustment, voucher, other_nonproduct, zero_or_negative]}]
    expressions:
      cancellation_lines_are_negative: "line_type <> 'cancellation' OR quantity < 0"
      product_lines_positive: "line_type <> 'product' OR (quantity > 0 AND price > 0)"
reconciliations:
  # Conservation (O2): classification may relabel lines but must not create or lose money.
  classification_conserves_amount: |
    WITH a AS (SELECT SUM(CAST(quantity AS DECIMAL(18, 0)) * CAST(price AS DECIMAL(18, 4))) AS v
               FROM (SELECT DISTINCT * FROM staging.stg_transactions)),
         b AS (SELECT SUM(amount) AS v FROM silver.transactions)
    SELECT a.v, b.v FROM a, b WHERE a.v IS DISTINCT FROM b.v
