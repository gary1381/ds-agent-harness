- qid: F-L11
  set: F
  author: luna
  lang: en
  question: What was cumulative net product sales, in GBP, at the end of each month
    from January through June 2025?
  keys:
  - month
  unit: gbp
  months:
  - 2025-01
  - 2025-06
  truth_sql: "WITH monthly AS (\n  SELECT\n    month,\n    SUM(CASE\n      WHEN line_type\
    \ = 'product' THEN amount\n      WHEN line_type = 'cancellation' THEN -ABS(amount)\n\
    \      ELSE 0\n    END) AS net_sales\n  FROM truth_lines\n  WHERE month BETWEEN\
    \ '2025-01' AND '2025-06'\n  GROUP BY month\n)\nSELECT\n  month,\n  SUM(net_sales)\
    \ OVER (ORDER BY month) AS value\nFROM monthly\n"
  notes: Each month’s value is the running sum of net product sales from January through
    that month.
