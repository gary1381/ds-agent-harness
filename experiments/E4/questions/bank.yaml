  keys: []
  unit: percent
  months:
  - 2025-01
  - 2025-06
  truth_sql: "WITH quarterly AS (\n  SELECT\n    SUM(CASE WHEN month BETWEEN '2025-01'\
    \ AND '2025-03' AND line_type = 'product' THEN amount ELSE 0 END) AS q1_sales,\n\
    \    SUM(CASE WHEN month BETWEEN '2025-04' AND '2025-06' AND line_type = 'product'\
    \ THEN amount ELSE 0 END) AS q2_sales\n  FROM truth_lines\n  WHERE month BETWEEN\
