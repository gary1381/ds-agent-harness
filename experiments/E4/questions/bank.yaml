    \ THEN 'y2025'\n              WHEN month BETWEEN '2024-04' AND '2024-06' THEN\
    \ 'y2024' END AS yr,\n         SUM(amount)::DOUBLE AS gross,\n         COUNT(DISTINCT\
    \ order_no)::DOUBLE AS orders\n  FROM truth_lines\n  WHERE line_type = 'product'\n\
    \  GROUP BY yr\n)\nSELECT (((SELECT gross / orders FROM p WHERE yr = 'y2025')\
    \ - (SELECT gross / orders FROM p WHERE yr = 'y2024'))\n  / (SELECT gross / orders\
    \ FROM p WHERE yr = 'y2024') * 100) AS value;\n"
  notes: Average order value for each quarter is recomputed from its totals (gross
    product sales over distinct orders). Change is measured against Q2 2024.
  truth_fixed: ROUND removed
