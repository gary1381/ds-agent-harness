    or the start of the data); as E3a R-L32'
- qid: F-L12
  set: F
  author: luna
  lang: en
  question: For each month from January through November 2025, what was the percentage
    change in gross product sales versus the same month in 2024?
  keys:
  - month
  unit: percent
  months:
  - 2024-01
  - 2025-11
  truth_sql: "WITH monthly AS (\n  SELECT month, SUM(amount) AS sales\n  FROM truth_lines\n\
    \  WHERE line_type = 'product'\n    AND month BETWEEN '2024-01' AND '2025-11'\n\
    \  GROUP BY month\n)\nSELECT\n  current.month AS month,\n  100.0 * (current.sales\
    \ - prior.sales) / NULLIF(prior.sales, 0) AS value\nFROM monthly AS current\n\
    JOIN monthly AS prior\n  ON prior.month = CAST(CAST(SUBSTR(current.month, 1, 4)\
    \ AS INTEGER) - 1 AS VARCHAR)\n    || SUBSTR(current.month, 5, 3)\nWHERE current.month\
    \ BETWEEN '2025-01' AND '2025-11'\nORDER BY month\n"
  notes: Each percentage uses the corresponding 2024 month as its base.
