- qid: F-H15
  set: F
  author: haiku
  lang: en
  question: Which three months from January 2024 to November 2025 had the highest
    cancellation rate? Give each month with its rate as a share between 0 and 1, not
    a percentage.
  keys:
  - month
  unit: share
  months:
  - 2024-01
  - 2025-11
  truth_sql: "WITH g AS (\n  SELECT month,\n         -SUM(CASE WHEN line_type = 'cancellation'\
    \ THEN amount ELSE 0 END)::DOUBLE AS canc,\n         SUM(CASE WHEN line_type =\
    \ 'product' THEN amount ELSE 0 END)::DOUBLE AS gross\n  FROM truth_lines\n  WHERE\
    \ month BETWEEN '2024-01' AND '2025-11'\n  GROUP BY month\n)\nSELECT month, (canc\
    \ / gross) AS value\nFROM g\nORDER BY value DESC\nLIMIT 3;\n"
  notes: Cancellation rate per month = cancelled value booked that month divided by
    gross product sales that month. Rounded to four decimals; a tie at the cut-off
    would drop this ranking.
  truth_fixed: ROUND removed
