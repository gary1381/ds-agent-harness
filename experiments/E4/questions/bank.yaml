  - 2025-07
  truth_sql: "SELECT\n  month,\n  SUM(qty) / COUNT(DISTINCT order_no) AS value\nFROM\
    \ truth_lines\nWHERE month BETWEEN '2025-05' AND '2025-07'\n  AND line_type =\
    \ 'product'\nGROUP BY month\nORDER BY month\n"
