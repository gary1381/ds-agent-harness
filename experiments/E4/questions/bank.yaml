- qid: F-H18
  set: F
  author: haiku
  lang: en
  question: How many new customers did we win in each month of 2025 from January to
    November? A new customer is one whose first product purchase in our data falls
    in that month. One row per month.
  keys:
  - month
  unit: count
  months:
  - 2025-01
  - 2025-11
  truth_sql: "WITH first_m AS (\n  SELECT buyer_id, MIN(month) AS fm\n  FROM truth_lines\n\
    \  WHERE line_type = 'product' AND buyer_id IS NOT NULL\n  GROUP BY buyer_id\n\
    )\nSELECT t.month, COUNT(DISTINCT t.buyer_id) AS value\nFROM truth_lines t\nJOIN\
    \ first_m f ON f.buyer_id = t.buyer_id AND f.fm = t.month\nWHERE t.line_type =\
    \ 'product'\n  AND t.buyer_id IS NOT NULL\n  AND t.month BETWEEN '2025-01' AND\
    \ '2025-11'\nGROUP BY t.month\nORDER BY t.month;\n"
  notes: 'New customers: active identified customers whose first product line in the
    whole data is in that month. Guests are never counted as customers.'
