- qid: F-L08
  set: F
  author: luna
  lang: en
  question: What share of active identified customers in March 2025 were repeat customers?
    Give the result as a share from 0 to 1.
  keys: []
  unit: share
  months:
  - 2025-03
  - 2025-03
  truth_sql: "WITH first_month AS (\n  SELECT buyer_id, MIN(month) AS first_month\n\
    \  FROM truth_lines\n  WHERE line_type = 'product'\n    AND buyer_id IS NOT NULL\n\
    \  GROUP BY buyer_id\n),\nactive AS (\n  SELECT DISTINCT buyer_id\n  FROM truth_lines\n\
    \  WHERE month = '2025-03'\n    AND line_type = 'product'\n    AND buyer_id IS\
    \ NOT NULL\n)\nSELECT\n  COUNT(*) FILTER (WHERE f.first_month < '2025-03')::DOUBLE\n\
    \    / NULLIF(COUNT(*), 0) AS value\nFROM active AS a\nJOIN first_month AS f USING\
    \ (buyer_id)\n"
  notes: Repeat means the customer had a product line in any earlier month; the denominator
    excludes guests.
- qid: F-L09
  set: F
  author: luna
  lang: en
  question: By what percentage did net product sales change from Q2 to Q3 2025? Use
    each quarter's gross product sales less its cancellation value.
  keys: []
  unit: percent
  months:
  - 2025-04
  - 2025-09
  truth_sql: "WITH totals AS (\n  SELECT\n    SUM(CASE\n      WHEN month BETWEEN '2025-04'\
    \ AND '2025-06' AND line_type = 'product' THEN amount\n      WHEN month BETWEEN\
    \ '2025-04' AND '2025-06' AND line_type = 'cancellation' THEN -ABS(amount)\n \
    \     ELSE 0\n    END) AS q2_net,\n    SUM(CASE\n      WHEN month BETWEEN '2025-07'\
    \ AND '2025-09' AND line_type = 'product' THEN amount\n      WHEN month BETWEEN\
    \ '2025-07' AND '2025-09' AND line_type = 'cancellation' THEN -ABS(amount)\n \
    \     ELSE 0\n    END) AS q3_net\n  FROM truth_lines\n)\nSELECT 100.0 * (q3_net\
    \ - q2_net) / NULLIF(q2_net, 0) AS value\nFROM totals\n"
  notes: Percentage change uses Q2 net product sales as the base; a positive result
    means sales increased.
- qid: F-L10
