- qid: F-H29
  set: F
  author: haiku
  lang: en
  question: By what percentage did gross product sales in GBP grow from Q2 2025 (April
    to June) to Q3 2025 (July to September)? Give the percent change, for example
    12.5 for an increase of 12.5 percent.
  keys: []
  unit: percent
  months:
  - 2025-04
  - 2025-09
  truth_sql: "WITH q AS (\n    SELECT CASE WHEN month <= '2025-06' THEN 'q2' ELSE\
    \ 'q3' END AS qtr,\n           SUM(amount) AS s\n    FROM truth_lines\n    WHERE\
    \ line_type = 'product' AND month BETWEEN '2025-04' AND '2025-09'\n    GROUP BY\
    \ 1\n)\nSELECT CAST((MAX(CASE WHEN qtr = 'q3' THEN s END) - MAX(CASE WHEN qtr\
    \ = 'q2' THEN s END))\n             * 100.0 / MAX(CASE WHEN qtr = 'q2' THEN s\
    \ END) AS DOUBLE) AS value\nFROM q;\n"
