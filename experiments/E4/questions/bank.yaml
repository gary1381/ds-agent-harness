- qid: F-H06
  set: F
  author: haiku
  lang: en
  question: In August 2025, what was the cancelled value per order in GBP, rounded
    to two decimals? Divide the cancellations booked that month by the number of orders
    placed that month.
  keys: []
  unit: gbp
  months:
  - 2025-08
  - 2025-08
  truth_sql: "WITH c AS (\n  SELECT -SUM(amount)::DOUBLE AS cancelled\n  FROM truth_lines\n\
    \  WHERE line_type = 'cancellation' AND month = '2025-08'\n),\no AS (\n  SELECT\
    \ COUNT(DISTINCT order_no) AS orders\n  FROM truth_lines\n  WHERE line_type =\
    \ 'product' AND month = '2025-08'\n)\nSELECT (c.cancelled / o.orders) AS value\n\
    FROM c, o;\n"
  notes: Cancelled value is booked in the month of the cancellation line, as a positive
    amount. The denominator is orders placed in the same month, counted from product
    lines.
  truth_fixed: ROUND removed
