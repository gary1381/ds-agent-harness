- qid: F-L31
  set: F
  author: luna
  lang: en
  question: For each month from January through November 2025, how much higher or
    lower were gross product sales than in the same month of 2024? Give the change
    in GBP.
  keys:
  - month
  unit: gbp
  months:
  - 2024-01
  - 2025-11
  truth_sql: "WITH monthly AS (\n  SELECT month, SUM(amount) AS sales\n  FROM truth_lines\n\
    \  WHERE month BETWEEN '2024-01' AND '2025-11'\n    AND line_type = 'product'\n\
    \  GROUP BY month\n)\nSELECT\n  current.month,\n  current.sales - prior.sales\
    \ AS value\nFROM monthly AS current\nJOIN monthly AS prior\n  ON prior.month =\
    \ strftime(\n    strptime(current.month || '-01', '%Y-%m-%d') - INTERVAL 1 YEAR,\n\
    \    '%Y-%m'\n  )\nWHERE current.month BETWEEN '2025-01' AND '2025-11'\nORDER\
    \ BY current.month\n"
  notes: For each 2025 month, subtracts gross product sales in the matching 2024 month.
  truth_fixed: months include the year-ago base
