- qid: F-H08
  set: F
  author: haiku
  lang: en
  question: What share of the customer numbers that bought in June 2025 had also bought
    in an earlier month? Give a share between 0 and 1, to four decimal places, not
    a percentage.
  keys: []
  unit: share
  months:
  - 2025-06
  - 2025-06
  truth_sql: "WITH active AS (\n  SELECT DISTINCT buyer_id\n  FROM truth_lines\n \
    \ WHERE line_type = 'product' AND buyer_id IS NOT NULL AND month = '2025-06'\n\
    ),\nearlier AS (\n  SELECT DISTINCT buyer_id\n  FROM truth_lines\n  WHERE line_type\
    \ = 'product' AND buyer_id IS NOT NULL AND month < '2025-06'\n)\nSELECT (AVG(CASE\
    \ WHEN e.buyer_id IS NOT NULL THEN 1.0 ELSE 0.0 END)) AS value\nFROM active a\n\
    LEFT JOIN earlier e ON e.buyer_id = a.buyer_id;\n"
  notes: Repeat customers in June 2025 divided by active customers in June 2025. Guest
    orders are excluded, since they are never customers.
  truth_fixed: ROUND removed
- qid: F-H09
  set: F
  author: haiku
  lang: en
  question: How much did net product sales, after cancellations, grow in Q1 2025 compared
    with Q1 2024? Give the percentage change to two decimals.
  keys: []
  unit: percent
  months:
  - 2024-01
  - 2025-03
  truth_sql: "WITH n AS (\n  SELECT SUM(CASE WHEN month BETWEEN '2025-01' AND '2025-03'\
    \ THEN amount END)::DOUBLE AS y25,\n         SUM(CASE WHEN month BETWEEN '2024-01'\
    \ AND '2024-03' THEN amount END)::DOUBLE AS y24\n  FROM truth_lines\n  WHERE line_type\
    \ IN ('product', 'cancellation')\n)\nSELECT ((y25 - y24) / y24 * 100) AS value\n\
    FROM n;\n"
  notes: Net product sales = gross product sales minus cancelled value. Cancellation
    amounts are already negative, so net equals the sum of product and cancellation
    lines. Growth is (Q1 2025 minus Q1 2024) divided by Q1 2024, as a percent.
  truth_fixed: ROUND removed
- qid: F-H10
  set: F
  author: haiku
  lang: en
  question: For each month from January to June 2025, what was the percentage change
    in net product sales compared with the same month a year earlier? One row per
    month, percent to two decimals.
  keys:
  - month
  unit: percent
  months:
  - 2024-01
  - 2025-06
  truth_sql: "WITH m AS (\n  SELECT month, SUM(amount)::DOUBLE AS net\n  FROM truth_lines\n\
    \  WHERE line_type IN ('product', 'cancellation')\n    AND month BETWEEN '2024-01'\
    \ AND '2025-06'\n  GROUP BY month\n)\nSELECT c.month, ((c.net - p.net) / p.net\
    \ * 100) AS value\nFROM m c\nJOIN m p ON p.month = '2024-' || SUBSTR(c.month,\
    \ 6, 2)\nWHERE c.month BETWEEN '2025-01' AND '2025-06'\nORDER BY c.month;\n"
  notes: Net product sales per month (gross minus cancelled value, both booked in
    the month), compared with the same calendar month in 2024.
  truth_fixed: ROUND removed
