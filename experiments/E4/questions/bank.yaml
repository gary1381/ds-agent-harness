- qid: F-H30
  set: F
  author: haiku
  lang: en
  question: For each month from January to June 2025, how much higher or lower were
    gross product sales in GBP than in the same month of 2024? Give the difference
    in GBP, negative if lower.
  keys:
  - month
  unit: gbp
  months:
  - 2024-01
  - 2025-06
  truth_sql: "WITH m AS (\n    SELECT month, SUM(amount) AS s\n    FROM truth_lines\n\
    \    WHERE line_type = 'product' AND month BETWEEN '2024-01' AND '2025-06'\n \
    \   GROUP BY month\n)\nSELECT cur.month AS month,\n       CAST(cur.s - prev.s\
    \ AS DOUBLE) AS value\nFROM m cur\nJOIN m prev\n  ON prev.month = CAST(CAST(SUBSTR(cur.month,\
    \ 1, 4) AS INTEGER) - 1 AS VARCHAR) || SUBSTR(cur.month, 5)\nWHERE cur.month BETWEEN\
    \ '2025-01' AND '2025-06'\nORDER BY cur.month;\n"
  notes: Year-on-year difference per month, this year minus last year, gross product
    sales.
  truth_fixed: months include the year-ago base
