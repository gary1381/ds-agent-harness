- id: q19
  lang: zh
  question: "2025年1月到6月，每个月的新客户数是多少？新客户指该月活跃、且在整个数据中首次有商品销售行的客户。"
  keys: [month]
  unit: count
  months: ["2025-01", "2025-06"]
  truth_sql: |
    WITH first_m AS (
        SELECT buyer_id, MIN(month) AS first_month
        FROM truth_lines
        WHERE line_type = 'product' AND buyer_id IS NOT NULL
        GROUP BY buyer_id
    )
    SELECT t.month AS month, COUNT(DISTINCT t.buyer_id) AS value
    FROM truth_lines t
    JOIN first_m f ON f.buyer_id = t.buyer_id
    WHERE t.line_type = 'product'
      AND t.month BETWEEN '2025-01' AND '2025-06'
      AND f.first_month = t.month
    GROUP BY t.month
    ORDER BY t.month;
  notes: "New customers per month: active identified customers whose first product line in the whole data is in that month."

- id: q20
  lang: en
  question: "For each month from January to June 2025, how many repeat customers did we have? A repeat customer is an identified customer active that month who had also bought in an earlier month."
  keys: [month]
  unit: count
  months: ["2025-01", "2025-06"]
  truth_sql: |
    WITH first_m AS (
        SELECT buyer_id, MIN(month) AS first_month
        FROM truth_lines
        WHERE line_type = 'product' AND buyer_id IS NOT NULL
        GROUP BY buyer_id
    )
    SELECT t.month AS month, COUNT(DISTINCT t.buyer_id) AS value
    FROM truth_lines t
    JOIN first_m f ON f.buyer_id = t.buyer_id
    WHERE t.line_type = 'product'
      AND t.month BETWEEN '2025-01' AND '2025-06'
      AND f.first_month < t.month
    GROUP BY t.month
    ORDER BY t.month;
  notes: "Repeat active customers per month: active identified customers whose first product month is earlier than the month shown."
