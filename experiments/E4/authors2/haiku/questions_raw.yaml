  notes: "Net product sales summed over the whole period. Cancellation amounts are already negative, so adding them nets them off."

- id: q13
  lang: en
  question: "Which five countries bought the most product from January to November 2025, by gross product sales in GBP? Give each country and its gross product sales."
  keys: [country]
  unit: gbp
  months: ["2025-01", "2025-11"]
