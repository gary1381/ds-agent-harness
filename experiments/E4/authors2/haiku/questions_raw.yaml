- id: q18
  lang: en
  question: "What was the UK cancellation rate in Q2 2025 (April to June)? Use cancelled value as a share of gross product sales, a number between 0 and 1."
  keys: []
  unit: share
  months: ["2025-04", "2025-06"]
  truth_sql: |
