- id: q15
  lang: zh
  question: "2025年1月至11月，按销售件数计算，前五名的商品编码是哪些？请列出每个编码及其件数（只计销售，不扣取消）。"
  keys: [sku]
  unit: count
  months: ["2025-01", "2025-11"]
