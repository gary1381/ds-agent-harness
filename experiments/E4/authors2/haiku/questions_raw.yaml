- id: q17
  lang: en
  question: "For July to September 2025, what share of gross product sales came from guest orders, separately for the UK and for non-UK markets? Give each as a number between 0 and 1."
  keys: [market]
  unit: share
  months: ["2025-07", "2025-09"]
  truth_sql: |
