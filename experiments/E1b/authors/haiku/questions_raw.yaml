- id: q14
  lang: en
  question: "How many subscribers churned in total during 2025, from January through December? Count each subscriber once."
  keys: []
  unit: count
  months: ["2025-01", "2025-12"]
  truth_sql: |
    SELECT COUNT(DISTINCT customer_id) AS value
    FROM truth_customer_month
