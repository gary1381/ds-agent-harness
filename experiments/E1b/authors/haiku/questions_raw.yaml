```yaml
- id: q01
  lang: en
  question: "What was the monthly churn rate in February 2026 across all subscribers? Give it as a share between 0 and 1, not a percentage."
  keys: []
  unit: share
  months: ["2026-02", "2026-02"]
  truth_sql: |
    SELECT CAST(SUM(CASE WHEN churned THEN 1 ELSE 0 END) AS DOUBLE) / COUNT(DISTINCT customer_id) AS value
    FROM truth_customer_month
    WHERE month = '2026-02' AND at_risk
  notes: "Official churn rate: churned customers divided by non-test subscribers active at the start of the month. Share, not percent."

- id: q02
  lang: en
  question: "How much net revenue did we book in Q1 2026 across all regions, in CNY?"
  keys: []
  unit: cny
  months: ["2026-01", "2026-03"]
  truth_sql: |
    SELECT SUM(net_revenue_fen) / 100.0 AS value
    FROM truth_revenue
    WHERE month BETWEEN '2026-01' AND '2026-03'
  notes: "Official net revenue (charges + add-ons - refunds, test accounts excluded), summed over Jan to Mar 2026 and converted from fen to CNY."

- id: q03
  lang: en
  question: "What was ARPU in November 2025? Give it in fen per subscriber, unrounded."
  keys: []
  unit: fen
  months: ["2025-11", "2025-11"]
  truth_sql: |
    WITH rev AS (
      SELECT SUM(net_revenue_fen) AS r
      FROM truth_revenue
      WHERE month = '2025-11'
    ),
    act AS (
      SELECT COUNT(DISTINCT customer_id) AS n
      FROM truth_customer_month
      WHERE month = '2025-11' AND at_risk
    )
    SELECT rev.r * 1.0 / act.n AS value
    FROM rev, act
  notes: "Official ARPU: net revenue of the month divided by non-test subscribers active at the start of the month. Result in fen, unrounded."

- id: q04
  lang: en
  question: "What was the churn rate in September 2025 for each sales region? Give shares between 0 and 1, not percentages."
  keys: [region]
  unit: share
  months: ["2025-09", "2025-09"]
  truth_sql: |
    SELECT d.region,
           CAST(SUM(CASE WHEN t.churned THEN 1 ELSE 0 END) AS DOUBLE) / COUNT(DISTINCT t.customer_id) AS value
    FROM truth_customer_month t
    JOIN dim_customer d ON d.customer_id = t.customer_id
    WHERE t.month = '2025-09' AND t.at_risk
    GROUP BY d.region
    ORDER BY d.region
  notes: "Official churn rate sliced by the customer's sales region from dim_customer. Shares, not percentages."

- id: q05
  lang: zh
  question: "2026年3月底，各个套餐分别有多少活跃订阅用户？请按基础版、Plus版和专业版分别给出数量。"
  keys: [plan]
  unit: count
  months: ["2026-03", "2026-03"]
  truth_sql: |
    SELECT d.plan, COUNT(DISTINCT t.customer_id) AS value
    FROM truth_customer_month t
    JOIN dim_customer d ON d.customer_id = t.customer_id
    WHERE t.month = '2026-04' AND t.at_risk
    GROUP BY d.plan
    ORDER BY d.plan
  notes: "Official end-of-month active count: active at the start of April equals active at the end of March. Uses the 2026-04 rows, non-test only, split by plan from dim_customer."

- id: q06
  lang: en
  question: "How many subscribers were active at the start of June 2025, split by acquisition channel?"
  keys: [channel]
  unit: count
  months: ["2025-06", "2025-06"]
  truth_sql: |
    SELECT d.channel, COUNT(DISTINCT t.customer_id) AS value
    FROM truth_customer_month t
    JOIN dim_customer d ON d.customer_id = t.customer_id
    WHERE t.month = '2025-06' AND t.at_risk
    GROUP BY d.channel
    ORDER BY d.channel
  notes: "Official active-at-start count (non-test, active at start of month), split by channel from dim_customer."

- id: q07
  lang: en
  question: "By what percentage did net revenue change from December 2025 to January 2026? Give the signed percent change, so a rise is positive and a fall is negative."
  keys: []
  unit: percent
  months: ["2025-12", "2026-01"]
  truth_sql: |
    WITH m AS (
      SELECT month, SUM(net_revenue_fen) AS r
      FROM truth_revenue
      WHERE month IN ('2025-12', '2026-01')
      GROUP BY month
    )
    SELECT (MAX(CASE WHEN month = '2026-01' THEN r END) - MAX(CASE WHEN month = '2025-12' THEN r END))
           * 100.0 / MAX(CASE WHEN month = '2025-12' THEN r END) AS value
    FROM m
  notes: "Month-over-month change of total net revenue across all regions, as (Jan - Dec) / Dec x 100. Signed, unrounded."

- id: q08
  lang: en
  question: "What was the total net revenue for the east region across all of 2025, in CNY?"
  keys: []
  unit: cny
  months: ["2025-01", "2025-12"]
  truth_sql: |
    SELECT SUM(net_revenue_fen) / 100.0 AS value
    FROM truth_revenue
    WHERE region = 'east' AND month BETWEEN '2025-01' AND '2025-12'
  notes: "Cumulative official net revenue for one region over Jan to Dec 2025, converted from fen to CNY."

- id: q09
  lang: en
  question: "On average, how many minutes did each subscriber who was active at the start of January 2026 watch during January? Give the mean per subscriber."
  keys: []
  unit: minutes
  months: ["2026-01", "2026-01"]
  truth_sql: |
    SELECT AVG(minutes) AS value
    FROM truth_customer_month
    WHERE month = '2026-01' AND at_risk
  notes: "Mean minutes per non-test subscriber active at the start of January 2026. Customers who signed up during the month are excluded, and so are customers with zero minutes who are not in the table for that month."

- id: q10
  lang: en
  question: "What was the highest three-month net revenue any single region reached in Q4 2025? Give the value in CNY."
  keys: []
  unit: cny
  months: ["2025-10", "2025-12"]
  truth_sql: |
    SELECT MAX(s) / 100.0 AS value
    FROM (
      SELECT region, SUM(net_revenue_fen) AS s
      FROM truth_revenue
      WHERE month BETWEEN '2025-10' AND '2025-12'
      GROUP BY region
    ) r
  notes: "Max over regions of Q4 2025 net revenue, converted to CNY. Returns the single top value, not the region name."

- id: q11
  lang: en
  question: "How many support tickets were opened per subscriber in February 2026? Give the ratio of total tickets to subscribers active at the start of February, as a decimal."
  keys: []
  unit: other
  months: ["2026-02", "2026-02"]
  truth_sql: |
    SELECT CAST(SUM(tickets) AS DOUBLE) / COUNT(DISTINCT customer_id) AS value
    FROM truth_customer_month
    WHERE month = '2026-02' AND at_risk
  notes: "Tickets opened by non-test subscribers active at the start of February, divided by that subscriber count. Tickets from customers who churned during February are included."

- id: q12
  lang: zh
  question: "2025年12月，专业版用户的月流失率比基础版高还是低？请给出专业版流失率减去基础版流失率的带符号差值，单位是百分点。"
  keys: []
  unit: percent
  months: ["2025-12", "2025-12"]
  truth_sql: |
    WITH r AS (
      SELECT d.plan,
             CAST(SUM(CASE WHEN t.churned THEN 1 ELSE 0 END) AS DOUBLE) / COUNT(DISTINCT t.customer_id) AS rate
      FROM truth_customer_month t
      JOIN dim_customer d ON d.customer_id = t.customer_id
      WHERE t.month = '2025-12' AND t.at_risk
      GROUP BY d.plan
    )
    SELECT (MAX(CASE WHEN plan = 'pro' THEN rate END) - MAX(CASE WHEN plan = 'basic' THEN rate END)) * 100 AS value
    FROM r
  notes: "Gap between two official churn rates by plan, pro minus basic, in percentage points (share difference x 100). Signed, so a negative value means pro churned less."

