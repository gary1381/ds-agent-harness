  notes: "Count of distinct non-test customers whose subscription ended in any month of 2025. The churned flag is only set for at-risk, non-test rows."

- id: q15
  lang: en
  question: "What share of total net revenue in January 2026 came from the west region? Give it as a share between 0 and 1."
  keys: []
  unit: share
  months: ["2026-01", "2026-01"]
  truth_sql: |
    SELECT SUM(CASE WHEN region = 'west' THEN net_revenue_fen ELSE 0 END) * 1.0 / SUM(net_revenue_fen) AS value
    FROM truth_revenue
    WHERE month = '2026-01'
  notes: "West net revenue divided by total net revenue for January 2026, both after refunds and test-account exclusion. Share, not percent."

- id: q16
  lang: en
  question: "What was the average monthly net revenue per region during 2025, in CNY? Give one figure for each region."
  keys: [region]
  unit: cny
  months: ["2025-01", "2025-12"]
  truth_sql: |
    SELECT region, AVG(m) / 100.0 AS value
    FROM (
      SELECT region, month, SUM(net_revenue_fen) AS m
      FROM truth_revenue
      WHERE month BETWEEN '2025-01' AND '2025-12'
      GROUP BY region, month
    ) r
    GROUP BY region
    ORDER BY region
  notes: "Mean of monthly net revenue per region over the 12 months of 2025 (region-months with no revenue are not in the table, so the mean is over booked months only). Converted to CNY."

- id: q17
  lang: en
  question: "For the March 2026 retention program, what was the effect measured as control churn rate minus treatment churn rate, in percentage points, counting every enrolled customer by their assigned arm?"
  keys: []
  unit: percent
  months: ["2026-03", "2026-03"]
  truth_sql: |
    SELECT (AVG(CASE WHEN arm = 'control' THEN CAST(churned AS DOUBLE) END)
          - AVG(CASE WHEN arm = 'treatment' THEN CAST(churned AS DOUBLE) END)) * 100 AS value
    FROM truth_program
    WHERE campaign_month = '2026-03'
  notes: "Intent-to-treat effect: control churn share minus treatment churn share, all enrolments regardless of exposure, times 100 for percentage points. Positive means the message reduced churn."

- id: q18
  lang: en
  question: "How many customers were enrolled in the April 2026 retention program in each arm? Give the count for treatment and for control."
  keys: [arm]
  unit: count
  months: ["2026-04", "2026-04"]
  truth_sql: |
    SELECT arm, COUNT(*) AS value
    FROM truth_program
    WHERE campaign_month = '2026-04'
    GROUP BY arm
    ORDER BY arm
  notes: "Enrolment rows for campaign month 2026-04 by randomised arm. Each enrolment is one customer."

- id: q19
  lang: zh
  question: "2026年4月的挽留计划中，处理组里实际看到挽留消息的客户占比是多少？请给出0到1之间的小数，而不是百分比。"
  keys: []
  unit: share
  months: ["2026-04", "2026-04"]
  truth_sql: |
    SELECT AVG(CASE WHEN exposed THEN 1.0 ELSE 0.0 END) AS value
    FROM truth_program
    WHERE campaign_month = '2026-04' AND arm = 'treatment'
  notes: "Share of treatment-arm enrolments that were exposed to the message in April 2026. Control rows are excluded because they can never be exposed."

