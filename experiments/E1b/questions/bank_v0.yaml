- qid: C-L14
  set: C
  author: luna
  lang: zh
  question: 2026年2月，paid_search渠道的流失率减去organic渠道的流失率，差值是多少个百分点？
  keys: []
  unit: percent
  months:
  - 2026-02
  - 2026-02
  truth_sql: "WITH rates AS (\n  SELECT d.channel,\n         SUM(CASE WHEN t.churned\
    \ THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS rate\n  FROM truth_customer_month t\n\
    \  JOIN dim_customer d USING (customer_id)\n  WHERE t.month = '2026-02'\n    AND\
