- qid: C-L02
  set: C
  author: luna
  lang: en
  question: How many non-test subscribers were active at the end of March 2026, by
    sales region?
  keys:
  - region
  unit: count
  months:
  - 2026-03
  - 2026-03
  truth_sql: "SELECT d.region, COUNT(*) AS value\nFROM truth_customer_month t\nJOIN\
    \ dim_customer d USING (customer_id)\nWHERE t.month = '2026-04'\n  AND t.active_at_start\n\
    \  AND NOT t.is_test\nGROUP BY d.region\nORDER BY d.region\n"
  notes: End of March is measured as active at the start of April, per the definition.
  dropped: same truth as B-H20
- qid: C-L03
  set: C
  author: luna
  lang: en
  question: What was the February 2026 churn rate, as a share from 0 to 1, for each
    plan?
  keys:
  - plan
  unit: share
  months:
  - 2026-02
  - 2026-02
  truth_sql: "SELECT d.plan, SUM(CASE WHEN t.churned THEN 1 ELSE 0 END) * 1.0\n  \
    \     / COUNT(*) AS value\nFROM truth_customer_month t\nJOIN dim_customer d USING\
    \ (customer_id)\nWHERE t.month = '2026-02'\n  AND t.at_risk\nGROUP BY d.plan\n\
    ORDER BY d.plan\n"
  notes: The denominator is non-test subscribers active at the start of February;
    the numerator is those who churned during February.
  dropped: same truth as B-L03
