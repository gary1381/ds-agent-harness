    FROM truth_customer_month t\nJOIN dim_customer d ON d.customer_id = t.customer_id\n\
    WHERE t.month BETWEEN '2025-01' AND '2025-12'\n  AND t.at_risk\n  AND NOT d.is_test\n\
    GROUP BY d.channel\n"
  notes: Tickets per subscriber-month, unit is tickets per subscriber-month (not a
    share). Numerator and denominator both restricted to at_risk rows for consistency
    with the start-of-month subscriber base.
