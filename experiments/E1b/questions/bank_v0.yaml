- qid: C-L07
  set: C
  author: luna
  lang: en
  question: By what percentage did net revenue grow from January to February 2026,
    including refunds?
  keys: []
  unit: percent
  months:
  - 2026-01
  - 2026-02
  truth_sql: "WITH monthly AS (\n  SELECT month, SUM(net_revenue_fen) AS revenue_fen\n\
    \  FROM truth_revenue\n  WHERE month IN ('2026-01', '2026-02')\n  GROUP BY month\n\
    )\nSELECT\n  (MAX(CASE WHEN month = '2026-02' THEN revenue_fen END)\n   - MAX(CASE\
    \ WHEN month = '2026-01' THEN revenue_fen END)) * 100.0\n  / MAX(CASE WHEN month\
    \ = '2026-01' THEN revenue_fen END) AS value\nFROM monthly\n"
  notes: Growth is (February revenue minus January revenue) divided by January revenue,
    multiplied by 100.
  dropped: same truth as B-L08
