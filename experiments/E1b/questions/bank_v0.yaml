- qid: C-H35
  set: C
  author: haiku
  lang: en
  question: For the March 2026 retention program, what was the churn rate in each
    arm? Count everyone enrolled in each arm, whether or not they actually saw the
    retention message, and give a share between 0 and 1.
  keys:
  - arm
  unit: share
  months:
  - 2026-03
  - 2026-03
  truth_sql: "SELECT p.arm,\n       AVG(CASE WHEN p.churned THEN 1.0 ELSE 0.0 END)\
    \ AS value\nFROM truth_program p\nJOIN dim_customer d ON d.customer_id = p.customer_id\n\
    WHERE p.campaign_month = '2026-03'\n  AND NOT d.is_test\nGROUP BY p.arm\n"
  notes: 'Intent-to-treat: grouped by randomised arm, not exposure. Share of enrolled
    customers who churned in March 2026. Test accounts excluded via dim_customer.'
  dropped: same truth as C-L15
- qid: C-H36
  set: C
  author: haiku
  lang: en
  question: Across all four campaign months combined (March to June 2026), what was
    the retention program's effect on churn? Compute the control churn rate minus
    the treatment churn rate, as a share (for example 0.02 for two percentage points),
    counting each enrolment once and treating everyone by randomised arm.
  keys: []
  unit: share
  months:
  - 2026-03
  - 2026-06
  truth_sql: "WITH x AS (\n  SELECT p.arm,\n         CASE WHEN p.churned THEN 1.0\
    \ ELSE 0.0 END AS c\n  FROM truth_program p\n  JOIN dim_customer d ON d.customer_id\
    \ = p.customer_id\n  WHERE NOT d.is_test\n    AND p.campaign_month BETWEEN '2026-03'\
    \ AND '2026-06'\n)\nSELECT AVG(CASE WHEN arm = 'control' THEN c END)\n     - AVG(CASE\
    \ WHEN arm = 'treatment' THEN c END) AS value\nFROM x\n"
  notes: 'Program effect as defined in the brief: control rate minus treatment rate,
    intent-to-treat, pooled over every enrolment in the four campaign months (not
    averaged across months).'
- qid: C-H37
  set: C
  author: haiku
  lang: en
  question: For each campaign month from March to June 2026, what share of the treatment
    customers actually saw the retention message? Give a decimal share for each month.
  keys:
  - campaign_month
  unit: share
  months:
  - 2026-03
  - 2026-06
  truth_sql: "SELECT p.campaign_month,\n       AVG(CASE WHEN p.exposed THEN 1.0 ELSE\
    \ 0.0 END) AS value\nFROM truth_program p\nJOIN dim_customer d ON d.customer_id\
    \ = p.customer_id\nWHERE p.arm = 'treatment'\n  AND NOT d.is_test\n  AND p.campaign_month\
    \ BETWEEN '2026-03' AND '2026-06'\nGROUP BY p.campaign_month\nORDER BY p.campaign_month\n"
  notes: Exposure rate among treatment-arm enrolments only. Control is always unexposed,
    so it is excluded from the denominator.
- qid: C-H38
  set: C
  author: haiku
  lang: en
  question: How many customers churned in April 2026, broken down by plan?
  keys:
  - plan
  unit: count
  months:
  - 2026-04
  - 2026-04
  truth_sql: "SELECT d.plan, COUNT(DISTINCT t.customer_id) AS value\nFROM truth_customer_month\
    \ t\nJOIN dim_customer d ON d.customer_id = t.customer_id\nWHERE t.month = '2026-04'\n\
    \  AND t.churned\n  AND NOT t.is_test\n  AND NOT d.is_test\nGROUP BY d.plan\n"
  notes: Official churned customers count for the month, by plan. Only at_risk customers
    can churn, so the population is consistent with the churn-rate definition.
