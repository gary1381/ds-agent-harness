- id: q15
  lang: en
  question: "For the March 2026 retention program, what was the churn rate in each arm? Count everyone enrolled in each arm, whether or not they actually saw the retention message, and give a share between 0 and 1."
  keys: [arm]
  unit: share
  months: ["2026-03", "2026-03"]
  truth_sql: |
    SELECT p.arm,
           AVG(CASE WHEN p.churned THEN 1.0 ELSE 0.0 END) AS value
    FROM truth_program p
    JOIN dim_customer d ON d.customer_id = p.customer_id
    WHERE p.campaign_month = '2026-03'
      AND NOT d.is_test
    GROUP BY p.arm
  notes: "Intent-to-treat: grouped by randomised arm, not exposure. Share of enrolled customers who churned in March 2026. Test accounts excluded via dim_customer."

- id: q16
  lang: en
  question: "Across all four campaign months combined (March to June 2026), what was the retention program's effect on churn? Compute the control churn rate minus the treatment churn rate, as a share (for example 0.02 for two percentage points), counting each enrolment once and treating everyone by randomised arm."
  keys: []
  unit: share
  months: ["2026-03", "2026-06"]
  truth_sql: |
    WITH x AS (
      SELECT p.arm,
             CASE WHEN p.churned THEN 1.0 ELSE 0.0 END AS c
      FROM truth_program p
      JOIN dim_customer d ON d.customer_id = p.customer_id
      WHERE NOT d.is_test
        AND p.campaign_month BETWEEN '2026-03' AND '2026-06'
    )
    SELECT AVG(CASE WHEN arm = 'control' THEN c END)
         - AVG(CASE WHEN arm = 'treatment' THEN c END) AS value
    FROM x
  notes: "Program effect as defined in the brief: control rate minus treatment rate, intent-to-treat, pooled over every enrolment in the four campaign months (not averaged across months)."

- id: q17
  lang: en
  question: "For each campaign month from March to June 2026, what share of the treatment customers actually saw the retention message? Give a decimal share for each month."
  keys: [campaign_month]
  unit: share
  months: ["2026-03", "2026-06"]
  truth_sql: |
    SELECT p.campaign_month,
           AVG(CASE WHEN p.exposed THEN 1.0 ELSE 0.0 END) AS value
    FROM truth_program p
    JOIN dim_customer d ON d.customer_id = p.customer_id
    WHERE p.arm = 'treatment'
      AND NOT d.is_test
      AND p.campaign_month BETWEEN '2026-03' AND '2026-06'
    GROUP BY p.campaign_month
    ORDER BY p.campaign_month
  notes: "Exposure rate among treatment-arm enrolments only. Control is always unexposed, so it is excluded from the denominator."

