- qid: R-H10
  set: R
  author: haiku
  lang: en
  question: For June to August 2025, what share of gross product sales came from guest
    orders (no customer number) in each market? Give shares between 0 and 1.
  keys:
  - market
  unit: share
  months:
  - 2025-06
  - 2025-08
  truth_sql: "SELECT market,\n       ROUND(COALESCE(SUM(CASE WHEN buyer_id IS NULL\
