- qid: R-H02
  set: R
  author: haiku
  lang: en
  question: Give me net product sales in GBP for each market over Q3 2024, net of
    cancellations.
  keys:
  - market
  unit: gbp
  months:
  - 2024-07
  - 2024-09
  truth_sql: "SELECT market,\n       ROUND(SUM(CASE WHEN line_type = 'product' THEN\
    \ amount\n                      WHEN line_type = 'cancellation' THEN amount END),\
