- qid: R-H07
  set: R
  author: haiku
  lang: en
  question: Show me the month-over-month percentage change in gross product sales
    for each month of 2025 through November, as a percent (for example, 12.5 means
    up 12.5%).
  keys:
  - month
  unit: percent
  months:
  - 2025-01
  - 2025-11
  truth_sql: "WITH m AS (\n  SELECT month, SUM(amount) AS g\n  FROM truth_lines\n\
    \  WHERE line_type = 'product'\n  GROUP BY month\n),\nw AS (\n  SELECT month,\
    \ g, LAG(g) OVER (ORDER BY month) AS prev\n  FROM m\n)\nSELECT month, ROUND(100\
    \ * (g - prev) / prev, 2) AS value\nFROM w\nWHERE month BETWEEN '2025-01' AND\
    \ '2025-11'\nORDER BY month;\n"
  notes: Growth percentage for each month versus the previous month. LAG runs before
    the month filter so January 2025 compares against December 2024. Percent is given
    as a number, not a fraction.
