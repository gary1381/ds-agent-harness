  author: haiku
  lang: en
  question: What share of total gross product sales in calendar 2024 came from non-UK
    customers? Give a share between 0 and 1, not a percentage.
  keys: []
  unit: share
  months:
  - 2024-01
  - 2024-12
  truth_sql: "SELECT SUM(CASE WHEN market = 'non-UK' THEN amount ELSE 0 END)::DOUBLE\n\
    \  / SUM(amount)::DOUBLE AS value\nFROM truth_lines\nWHERE line_type = 'product'\
    \ AND month BETWEEN '2024-01' AND '2024-12';\n"
  notes: Ratio of non-UK gross product sales to total gross product sales over the
    full year, recomputed from totals.
- qid: R-H29
  set: R
  author: haiku
  lang: en
  question: Which five products, identified by item code, brought in the most gross
    product sales in pounds from January to November 2025? Give me the value for each.
  keys:
  - sku
  unit: gbp
  months:
  - 2025-01
  - 2025-11
  truth_sql: 'SELECT sku, SUM(amount) AS value

    FROM truth_lines

    WHERE line_type = ''product'' AND month BETWEEN ''2025-01'' AND ''2025-11''

    GROUP BY sku

    ORDER BY value DESC

    LIMIT 5;

    '
  notes: Gross product sales by sku, top 5 descending. December 2025 excluded because
    it is incomplete.
- qid: R-H30
  set: R
  author: haiku
  lang: en
  question: For November 2025, how much gross product sales did an average active
    UK customer generate, in pounds? Take the sales from UK orders placed by identified
    customers, and divide by the number of active UK customers that month.
  keys: []
  unit: gbp
  months:
  - 2025-11
  - 2025-11
  truth_sql: "SELECT SUM(amount)::DOUBLE / COUNT(DISTINCT buyer_id) AS value\nFROM\
    \ truth_lines\nWHERE line_type = 'product' AND market = 'UK'\n  AND buyer_id IS\
    \ NOT NULL AND month = '2025-11';\n"
  notes: Numerator restricted to customer-linked UK product sales so it matches the
    denominator of active UK customers. Guest sales excluded from both.
- qid: R-H31
  set: R
  author: haiku
  lang: en
  question: What were our net product sales in GBP for January to June 2024 combined,
    after taking off cancellations?
  keys: []
  unit: gbp
  months:
  - 2024-01
  - 2024-06
  truth_sql: 'SELECT SUM(CASE WHEN line_type IN (''product'', ''cancellation'') THEN
    amount ELSE 0 END)::DOUBLE AS value

    FROM truth_lines

    WHERE month BETWEEN ''2024-01'' AND ''2024-06'';

    '
  notes: Cancellation amounts are already negative, so summing product and cancellation
    lines gives gross minus cancelled value, summed over the six months.
- qid: R-H32
  set: R
  author: haiku
  lang: en
  question: What is the difference in average order value between UK and non-UK orders
    from January to November 2025? Give UK minus non-UK, in pounds.
  keys: []
  unit: gbp
  months:
  - 2025-01
  - 2025-11
  truth_sql: "SELECT\n  SUM(CASE WHEN market = 'UK' THEN amount END)::DOUBLE\n   \
    \ / COUNT(DISTINCT CASE WHEN market = 'UK' THEN order_no END)\n  -\n  SUM(CASE\
    \ WHEN market = 'non-UK' THEN amount END)::DOUBLE\n    / COUNT(DISTINCT CASE WHEN\
    \ market = 'non-UK' THEN order_no END)\n  AS value\nFROM truth_lines\nWHERE line_type\
    \ = 'product' AND month BETWEEN '2025-01' AND '2025-11';\n"
  notes: Each market's average order value is recomputed from its period totals, then
    subtracted. Positive means UK is higher.
- qid: R-H33
  set: R
  author: haiku
  lang: en
  question: Which three countries had the highest gross product sales in Q1 2025 (January
    to March)? Give me the pound value for each.
  keys:
  - country
  unit: gbp
  months:
  - 2025-01
  - 2025-03
  truth_sql: 'SELECT country, SUM(amount) AS value

    FROM truth_lines

    WHERE line_type = ''product'' AND month BETWEEN ''2025-01'' AND ''2025-03''

