  lang: en
  question: Which five countries had the highest gross product sales in September
    2025, and what were their sales in GBP? Exclude rows without a country; break
    ties alphabetically.
  keys:
  - country
  unit: gbp
  months:
  - 2025-09
  - 2025-09
