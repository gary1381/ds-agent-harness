- qid: R-L07
  set: R
  author: luna
  lang: en
  question: By what percentage did UK gross product sales grow from February to March
    2025? Use February as the comparison base.
  keys: []
  unit: percent
  months:
  - 2025-02
  - 2025-03
  truth_sql: "WITH monthly AS (\n  SELECT month, SUM(amount) AS gross_sales\n  FROM\
    \ truth_lines\n  WHERE month IN ('2025-02', '2025-03')\n    AND market = 'UK'\n\
    \    AND line_type = 'product'\n  GROUP BY month\n)\nSELECT\n  100.0 * (MAX(CASE\
    \ WHEN month = '2025-03' THEN gross_sales END)\n         / NULLIF(MAX(CASE WHEN\
    \ month = '2025-02' THEN gross_sales END), 0) - 1) AS value\nFROM monthly\n"
  notes: Percentage growth is (March sales / February sales - 1) × 100.
- qid: R-L08
