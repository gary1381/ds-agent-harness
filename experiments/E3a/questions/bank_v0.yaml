- qid: R-L17
  set: R
  author: luna
  lang: en
  question: How many repeat customers were active in May 2025? Count customers with
    a product line in an earlier month, and exclude guests.
  keys: []
  unit: count
  months:
  - 2025-05
  - 2025-05
  truth_sql: "WITH first_month AS (\n  SELECT buyer_id, MIN(month) AS first_product_month\n\
    \  FROM truth_lines\n  WHERE line_type = 'product'\n    AND buyer_id IS NOT NULL\n\
    \  GROUP BY buyer_id\n)\nSELECT COUNT(DISTINCT t.buyer_id) AS value\nFROM truth_lines\
    \ t\nJOIN first_month f ON t.buyer_id = f.buyer_id\nWHERE t.month = '2025-05'\n\
