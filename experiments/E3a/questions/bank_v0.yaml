- qid: R-L01
  set: R
  author: luna
  lang: en
  question: How much gross product sales did we book in February 2025 in the UK? Please
    give GBP.
  keys: []
  unit: gbp
  months:
  - 2025-02
  - 2025-02
  truth_sql: "SELECT COALESCE(SUM(amount), 0) AS value\nFROM truth_lines\nWHERE month\
    \ = '2025-02'\n  AND market = 'UK'\n  AND line_type = 'product'\n"
  notes: Gross product sales include product lines and exclude cancellations and non-product
    lines.
- qid: R-L02
  set: R
  author: luna
  lang: en
  question: What were net product sales in Q1 2025 for non-UK markets, in GBP?
  keys: []
  unit: gbp
  months:
  - 2025-01
  - 2025-03
  truth_sql: "SELECT\n  COALESCE(SUM(CASE WHEN line_type = 'product' THEN amount ELSE\
    \ 0 END), 0)\n  - COALESCE(SUM(CASE WHEN line_type = 'cancellation' THEN ABS(amount)\
    \ ELSE 0 END), 0) AS value\nFROM truth_lines\nWHERE month BETWEEN '2025-01' AND\
    \ '2025-03'\n  AND market = 'non-UK'\n"
  notes: Net product sales are gross product sales minus the positive value of cancellation
    lines.
- qid: R-L03
  set: R
  author: luna
  lang: en
  question: How many orders had at least one product line in November 2025?
  keys: []
  unit: count
  months:
  - 2025-11
  - 2025-11
  truth_sql: "SELECT COUNT(DISTINCT order_no) AS value\nFROM truth_lines\nWHERE month\
    \ = '2025-11'\n  AND line_type = 'product'\n"
  notes: Counts distinct orders with at least one product line.
- qid: R-L04
  set: R
  author: luna
  lang: en
  question: What was the average order value in the UK in June 2024, in GBP?
  keys: []
  unit: gbp
  months:
  - 2024-06
  - 2024-06
  truth_sql: "WITH sales AS (\n  SELECT COALESCE(SUM(amount), 0) AS gross_sales\n\
    \  FROM truth_lines\n  WHERE month = '2024-06'\n    AND market = 'UK'\n    AND\
    \ line_type = 'product'\n),\norders AS (\n  SELECT COUNT(DISTINCT order_no) AS\
    \ order_count\n  FROM truth_lines\n  WHERE month = '2024-06'\n    AND market =\
    \ 'UK'\n    AND line_type = 'product'\n)\nSELECT CASE WHEN order_count = 0 THEN\
    \ NULL\n            ELSE gross_sales / order_count END AS value\nFROM sales CROSS\
    \ JOIN orders\n"
  notes: Average order value is gross product sales divided by distinct orders containing
    product lines.
