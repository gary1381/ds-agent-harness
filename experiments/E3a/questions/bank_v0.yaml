- qid: R-L11
  set: R
  author: luna
  lang: en
  question: In May 2025, how much gross product sales in GBP did we have per active
    customer? Include guest-order sales in the sales total, but exclude guests from
    the customer count.
  keys: []
  unit: gbp
  months:
  - 2025-05
  - 2025-05
  truth_sql: "WITH sales AS (\n  SELECT COALESCE(SUM(amount), 0) AS gross_sales\n\
    \  FROM truth_lines\n  WHERE month = '2025-05'\n    AND line_type = 'product'\n\
    ),\ncustomers AS (\n  SELECT COUNT(DISTINCT buyer_id) AS customer_count\n  FROM\
    \ truth_lines\n  WHERE month = '2025-05'\n    AND line_type = 'product'\n    AND\
    \ buyer_id IS NOT NULL\n)\nSELECT gross_sales / NULLIF(customer_count, 0) AS value\n\
    FROM sales CROSS JOIN customers\n"
  notes: Divides all product sales, including guest orders, by distinct active customer
    numbers.
