- qid: R-L27
  set: R
  author: luna
  lang: en
  question: By what percentage did UK net product sales change from January to February
    2025? Use January as the base.
  keys: []
  unit: percent
  months:
  - 2025-01
  - 2025-02
  truth_sql: "WITH monthly AS (\n  SELECT\n    month,\n    SUM(CASE WHEN line_type\
    \ = 'product' THEN amount ELSE 0 END)\n      - SUM(CASE WHEN line_type = 'cancellation'\
    \ THEN -amount ELSE 0 END) AS net_sales\n  FROM truth_lines\n  WHERE month BETWEEN\
    \ '2025-01' AND '2025-02'\n    AND market = 'UK'\n  GROUP BY month\n)\nSELECT\n\
    \  100.0 * (\n    MAX(CASE WHEN month = '2025-02' THEN net_sales END)\n    / NULLIF(MAX(CASE\
    \ WHEN month = '2025-01' THEN net_sales END), 0) - 1\n  ) AS value\nFROM monthly\n"
  notes: Percentage change is (February net sales / January net sales - 1) × 100.
