- qid: R-H40
  set: R
  author: haiku
  lang: zh
  question: 2025年1月至11月，英国市场和非英国市场的取消率分别是多少？请用0到1之间的份额表示，不要用百分比。
  keys:
  - market
  unit: share
  months:
  - 2025-01
  - 2025-11
  truth_sql: "SELECT g.market,\n  COALESCE(c.cancelled, 0) / g.gross AS value\nFROM\
    \ (\n  SELECT market, SUM(amount)::DOUBLE AS gross\n  FROM truth_lines\n  WHERE\
    \ line_type = 'product' AND month BETWEEN '2025-01' AND '2025-11'\n  GROUP BY\
    \ market\n) g\nLEFT JOIN (\n  SELECT market, (-SUM(amount))::DOUBLE AS cancelled\n\
    \  FROM truth_lines\n  WHERE line_type = 'cancellation' AND month BETWEEN '2025-01'\
    \ AND '2025-11'\n  GROUP BY market\n) c ON g.market = c.market\nORDER BY g.market;\n"
  notes: 'Cancellation rate per market over the period: cancelled value divided by
    gross product sales, both summed over the period before dividing.'
