- qid: R-L18
  set: R
  author: luna
  lang: en
  question: How much did gross product sales change in percentage terms from Q2 to
    Q3 2025? Use Q2 as the base.
  keys: []
  unit: percent
  months:
  - 2025-04
  - 2025-09
  truth_sql: "WITH quarterly AS (\n  SELECT\n    CASE WHEN month BETWEEN '2025-04'\
    \ AND '2025-06' THEN 'Q2'\n         ELSE 'Q3' END AS quarter,\n    SUM(amount)\
    \ AS gross_sales\n  FROM truth_lines\n  WHERE month BETWEEN '2025-04' AND '2025-09'\n\
    \    AND line_type = 'product'\n  GROUP BY quarter\n)\nSELECT\n  100.0 * (MAX(CASE\
    \ WHEN quarter = 'Q3' THEN gross_sales END)\n         / NULLIF(MAX(CASE WHEN quarter\
    \ = 'Q2' THEN gross_sales END), 0) - 1) AS value\nFROM quarterly\n"
  notes: Percentage change is (Q3 gross sales / Q2 gross sales - 1) × 100, across
    all markets.
- qid: R-L19
  set: R
  author: luna
  lang: en
  question: What share of active customers in October 2024 were repeat customers?
    Exclude guests and give the result as a percentage.
  keys: []
  unit: percent
  months:
  - 2024-10
  - 2024-10
  truth_sql: "WITH first_month AS (\n  SELECT buyer_id, MIN(month) AS first_product_month\n\
    \  FROM truth_lines\n  WHERE line_type = 'product'\n    AND buyer_id IS NOT NULL\n\
    \  GROUP BY buyer_id\n),\nactive AS (\n  SELECT DISTINCT buyer_id\n  FROM truth_lines\n\
    \  WHERE month = '2024-10'\n    AND line_type = 'product'\n    AND buyer_id IS\
    \ NOT NULL\n)\nSELECT\n  100.0 * COUNT(*) FILTER (WHERE f.first_product_month\
    \ < '2024-10')\n  / NULLIF(COUNT(*), 0) AS value\nFROM active a\nJOIN first_month\
    \ f ON a.buyer_id = f.buyer_id\n"
  notes: Repeat-customer share is repeat active customers divided by all active customers
    that month.
- qid: R-L20
  set: R
  author: luna
  lang: en
  question: In Q4 2024, what were net product sales per order in non-UK markets, in
    GBP? Count orders with product lines.
  keys: []
  unit: gbp
  months:
  - 2024-10
  - 2024-12
  truth_sql: "WITH totals AS (\n  SELECT\n    COALESCE(SUM(CASE WHEN line_type = 'product'\
    \ THEN amount ELSE 0 END), 0)\n    - COALESCE(SUM(CASE WHEN line_type = 'cancellation'\
    \ THEN ABS(amount) ELSE 0 END), 0) AS net_sales,\n    COUNT(DISTINCT CASE WHEN\
