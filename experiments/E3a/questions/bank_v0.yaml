- qid: R-H34
  set: R
  author: haiku
  lang: en
  question: From January to November 2025, what share of gross product sales came
    from guest orders, meaning orders with no customer number? Give a share between
    0 and 1.
  keys: []
  unit: share
  months:
  - 2025-01
  - 2025-11
  truth_sql: "SELECT SUM(CASE WHEN buyer_id IS NULL THEN amount ELSE 0 END)::DOUBLE\n\
    \  / SUM(amount)::DOUBLE AS value\nFROM truth_lines\nWHERE line_type = 'product'\
    \ AND month BETWEEN '2025-01' AND '2025-11';\n"
  notes: Guest share of gross product sales over the period, recomputed from totals.
- qid: R-H35
  set: R
  author: haiku
  lang: en
  question: How much cancelled value did we book in each market in April, May and
    June 2025, in pounds?
  keys:
  - market
  unit: gbp
  months:
  - 2025-04
  - 2025-06
  truth_sql: 'SELECT market, (-SUM(amount))::DOUBLE AS value

    FROM truth_lines

    WHERE line_type = ''cancellation'' AND month BETWEEN ''2025-04'' AND ''2025-06''

    GROUP BY market

    ORDER BY market;

    '
  notes: Cancelled value is positive and booked in the month of the cancellation line,
    per market.
- qid: R-H36
  set: R
  author: haiku
  lang: en
  question: How many new customers did we gain each month in 2024? A new customer
    is one whose first purchase with us in our data falls in that month.
  keys:
  - month
  unit: count
  months:
  - 2024-01
  - 2024-12
  truth_sql: "WITH fm AS (\n  SELECT buyer_id, MIN(month) AS first_m\n  FROM truth_lines\n\
    \  WHERE line_type = 'product' AND buyer_id IS NOT NULL\n  GROUP BY buyer_id\n\
    )\nSELECT first_m AS month, COUNT(*) AS value\nFROM fm\nWHERE first_m BETWEEN\
    \ '2024-01' AND '2024-12'\nGROUP BY first_m\nORDER BY first_m;\n"
  notes: First product line across the whole data determines the month of entry. Guest
    orders never count as customers.
- qid: R-H37
  set: R
  author: haiku
  lang: en
  question: How many customers ordered in November 2025 who had already bought from
    us in an earlier month?
  keys: []
  unit: count
  months:
  - 2025-11
  - 2025-11
  truth_sql: "WITH active AS (\n  SELECT DISTINCT buyer_id\n  FROM truth_lines\n \
    \ WHERE line_type = 'product' AND buyer_id IS NOT NULL AND month = '2025-11'\n\
    ),\nprior AS (\n  SELECT DISTINCT buyer_id\n  FROM truth_lines\n  WHERE line_type\
    \ = 'product' AND buyer_id IS NOT NULL AND month < '2025-11'\n)\nSELECT COUNT(*)\
    \ AS value\nFROM active\nWHERE buyer_id IN (SELECT buyer_id FROM prior);\n"
  notes: 'Repeat customers in the month: active customers with a product line in any
    earlier month in the data.'
- qid: R-H38
