    customers.
- qid: R-H11
  set: R
  author: haiku
  lang: zh
  question: 2025年1月到11月，英国市场的平均订单金额（毛产品销售额除以订单数）是非英国市场的几倍？请保留三位小数。
  keys: []
  unit: other
  months:
  - 2025-01
  - 2025-11
  truth_sql: "WITH a AS (\n  SELECT market,\n         SUM(amount) / COUNT(DISTINCT\
    \ order_no) AS aov\n  FROM truth_lines\n  WHERE line_type = 'product' AND month\
    \ BETWEEN '2025-01' AND '2025-11'\n  GROUP BY market\n)\nSELECT ROUND((SELECT\
    \ aov FROM a WHERE market = 'UK') / (SELECT aov FROM a WHERE market = 'non-UK'),\
    \ 3) AS value;\n"
  notes: Ratio of the official average order value for UK to non-UK over the whole
    period. Both averages are recomputed from period totals. The answer is a plain
    multiple (for example 1.250), not a percent.
- qid: R-H12
  set: R
  author: haiku
  lang: en
  question: Give me the cumulative net product sales in GBP for 2024, month by month,
    starting from January 2024.
  keys:
  - month
  unit: gbp
  months:
  - 2024-01
  - 2024-12
  truth_sql: "WITH m AS (\n  SELECT month, SUM(amount) AS net\n  FROM truth_lines\n\
    \  WHERE line_type IN ('product', 'cancellation')\n    AND month BETWEEN '2024-01'\
    \ AND '2024-12'\n  GROUP BY month\n)\nSELECT month,\n       ROUND(SUM(net) OVER\
    \ (ORDER BY month ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW), 2) AS value\n\
    FROM m\nORDER BY month;\n"
  notes: Running total of official net product sales from January 2024. The filter
    sits inside the CTE so December 2023 is not included in the running sum.
- qid: R-H13
  set: R
