  set: B
  author: luna
  lang: en
  question: What was net revenue in February 2026, including add-ons and refunds, in CNY?
  keys: []
  unit: cny
  months:
  - 2026-02
  - 2026-02
  truth_sql: 'SELECT SUM(net_revenue_fen) / 100.0 AS value

    FROM truth_revenue

    WHERE month = ''2026-02''

    '
  author_notes: Uses net revenue as booked in February; the source already excludes test accounts.
- qid: B-L02
  set: B
  author: luna
  lang: zh
  question: 2026年2月底，各销售区域有多少名活跃订阅用户？请按区域列出人数。
  keys:
  - region
  unit: count
  months:
  - 2026-02
  - 2026-02
  truth_sql: "SELECT d.region, COUNT(DISTINCT m.customer_id) AS value\nFROM truth_customer_month m\nJOIN dim_customer\
    \ d USING (customer_id)\nWHERE m.month = '2026-03'\n  AND m.active_at_start\n  AND NOT m.is_test\nGROUP BY d.region\n"
  author_notes: 月末活跃人数按次月月初活跃人数计算，并排除测试账户。
- qid: B-L03
  set: B
  author: luna
  lang: en
  question: What was the February 2026 churn rate for each plan, as a share from 0 to 1?
  keys:
  - plan
  unit: share
  months:
  - 2026-02
  - 2026-02
  truth_sql: "SELECT d.plan,\n       SUM(CASE WHEN m.churned THEN 1 ELSE 0 END) * 1.0\n         / COUNT(DISTINCT\
    \ CASE WHEN m.at_risk THEN m.customer_id END) AS value\nFROM truth_customer_month m\nJOIN dim_customer d USING\
    \ (customer_id)\nWHERE m.month = '2026-02'\n  AND NOT m.is_test\nGROUP BY d.plan\n"
  author_notes: Churn rate is churned customers divided by non-test customers active at the start of the month.
- qid: B-L04
  set: B
