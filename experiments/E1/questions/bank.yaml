- qid: B-L08
  set: B
  author: luna
  lang: en
  question: By what percent did net revenue change from January to February 2026? Use January as the baseline.
  keys: []
  unit: percent
  months:
  - 2026-01
  - 2026-02
  truth_sql: "WITH monthly AS (\n  SELECT month, SUM(net_revenue_fen) AS revenue_fen\n  FROM truth_revenue\n  WHERE\
    \ month IN ('2026-01', '2026-02')\n  GROUP BY month\n)\nSELECT (MAX(CASE WHEN month = '2026-02' THEN revenue_fen\
    \ END)\n          - MAX(CASE WHEN month = '2026-01' THEN revenue_fen END))\n         * 100.0\n         / MAX(CASE\
    \ WHEN month = '2026-01' THEN revenue_fen END) AS value\nFROM monthly\n"
  author_notes: Percentage change is (February minus January) divided by January, multiplied by 100.
- qid: B-L09
  set: B
  author: luna
  lang: en
  question: What share of March 2026 net revenue came from each sales region? Report each share as a fraction from
    0 to 1.
  keys:
  - region
  unit: share
  months:
  - 2026-03
  - 2026-03
  truth_sql: "SELECT region,\n       net_revenue_fen * 1.0\n         / SUM(net_revenue_fen) OVER () AS value\nFROM\
    \ truth_revenue\nWHERE month = '2026-03'\n"
  author_notes: Each region's share is its net revenue divided by total net revenue for March.
