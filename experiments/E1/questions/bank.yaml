- qid: B-L14
  set: B
  author: luna
  lang: en
  question: In February 2026, by how much did the pro churn rate exceed the basic churn rate? Report the difference
    as a share, not a percentage.
  keys: []
  unit: share
  months:
  - 2026-02
  - 2026-02
  truth_sql: "WITH rates AS (\n  SELECT d.plan,\n         SUM(CASE WHEN m.churned THEN 1 ELSE 0 END) * 1.0\n   \
    \        / COUNT(DISTINCT CASE WHEN m.at_risk THEN m.customer_id END) AS churn_rate\n  FROM truth_customer_month\
    \ m\n  JOIN dim_customer d USING (customer_id)\n  WHERE m.month = '2026-02'\n    AND NOT m.is_test\n  GROUP\
    \ BY d.plan\n)\nSELECT MAX(CASE WHEN plan = 'pro' THEN churn_rate END)\n         - MAX(CASE WHEN plan = 'basic'\
    \ THEN churn_rate END) AS value\nFROM rates\n"
  author_notes: Subtracts the basic churn rate from the pro churn rate; rates use the official start-of-month denominator.
- qid: B-L15
  set: B
  author: luna
  lang: en
  question: For February 2026, what was net revenue in fen per subscriber active at the start of the month in each
    sales region?
  keys:
  - region
  unit: fen
  months:
  - 2026-02
  - 2026-02
  truth_sql: "WITH revenue AS (\n  SELECT region, SUM(net_revenue_fen) AS revenue_fen\n  FROM truth_revenue\n  WHERE\
    \ month = '2026-02'\n  GROUP BY region\n),\nsubscribers AS (\n  SELECT d.region, COUNT(DISTINCT m.customer_id)\
    \ AS subscriber_count\n  FROM truth_customer_month m\n  JOIN dim_customer d USING (customer_id)\n  WHERE m.month\
    \ = '2026-02'\n    AND m.active_at_start\n    AND NOT m.is_test\n  GROUP BY d.region\n)\nSELECT r.region, r.revenue_fen\
    \ * 1.0 / s.subscriber_count AS value\nFROM revenue r\nJOIN subscribers s USING (region)\n"
  author_notes: Divides each region's February net revenue by its non-test subscribers active at February start.
