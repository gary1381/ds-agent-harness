- qid: B-H12
  set: B
  author: haiku
  lang: en
  question: In January 2026, how many support tickets did subscribers open on average per subscriber for each plan?
    Count only subscribers active at the start of the month, and round to three decimals.
  keys:
  - plan
  unit: other
  months:
  - 2026-01
  - 2026-01
  truth_sql: "SELECT d.plan AS plan,\n       (AVG(t.tickets)) AS value\nFROM truth_customer_month t\nJOIN dim_customer\
    \ d USING (customer_id)\nWHERE t.month = '2026-01' AND t.at_risk\nGROUP BY d.plan\nORDER BY d.plan\n"
  author_notes: Tickets per subscriber, averaged over the at-risk population (zero-ticket subscribers included).
    Unit is tickets per subscriber, a ratio.
- qid: B-H13
  set: B
  author: haiku
  lang: en
  question: In January 2026, what was the churn rate of paid search customers divided by the churn rate of organic
    customers? Round to three decimals.
  keys: []
  unit: other
  months:
  - 2026-01
  - 2026-01
  truth_sql: "WITH r AS (\n  SELECT d.channel AS channel,\n         AVG(CASE WHEN t.churned THEN 1.0 ELSE 0.0 END)\
    \ AS rate\n  FROM truth_customer_month t\n  JOIN dim_customer d USING (customer_id)\n  WHERE t.month = '2026-01'\
    \ AND t.at_risk\n  GROUP BY d.channel\n)\nSELECT ((SELECT rate FROM r WHERE channel = 'paid_search')\n     \
    \    / (SELECT rate FROM r WHERE channel = 'organic')) AS value\n"
  author_notes: Ratio of two official churn rates (at-risk denominators), so the result is a unitless ratio, not
    a share or percent.
- qid: B-H14
  set: B
  author: haiku
  lang: en
  question: Between February 2025 and May 2026, in how many months did total net revenue come in lower than in the
    month before?
  keys: []
  unit: count
  months:
  - 2025-02
  - 2026-05
  truth_sql: "WITH m AS (\n  SELECT month, SUM(net_revenue_fen) AS rev\n  FROM truth_revenue\n  WHERE month BETWEEN\
    \ '2025-01' AND '2026-05'\n  GROUP BY month\n),\nl AS (\n  SELECT month, rev, LAG(rev) OVER (ORDER BY month)\
    \ AS prev\n  FROM m\n)\nSELECT COUNT(*) AS value\nFROM l\nWHERE prev IS NOT NULL AND rev < prev\n"
  author_notes: Compares total monthly net revenue across regions with the previous month. Strictly lower counts;
    equal does not. January 2025 is used only as the comparison base.
- qid: B-H15
  set: B
  author: haiku
  lang: en
  question: Across the retention program campaign months March to May 2026, what was the difference between the
    control churn rate and the treatment churn rate (control minus treatment), counting everyone as enrolled in
    their arm whether or not they saw the message? Give it as a share, not a percentage, rounded to four decimals.
  keys: []
  unit: share
  months:
  - 2026-03
  - 2026-05
  truth_sql: "SELECT ROUND(\n         AVG(CASE WHEN p.churned THEN 1.0 ELSE 0.0 END) FILTER (WHERE p.arm = 'control')\n\
    \         - AVG(CASE WHEN p.churned THEN 1.0 ELSE 0.0 END) FILTER (WHERE p.arm = 'treatment'),\n         4)\
    \ AS value\nFROM truth_program p\nJOIN dim_customer d USING (customer_id)\nWHERE NOT d.is_test\n  AND p.campaign_month\
    \ BETWEEN '2026-03' AND '2026-05'\n"
  author_notes: 'Intent-to-treat program effect: control churn share minus treatment churn share, pooled across
    the three campaign months. Test accounts excluded.'
  dropped: 'duplicate of B-L20 (same question, same truth: pooled March-May ITT effect)'
- qid: B-H16
  set: B
  author: haiku
  lang: en
  question: Across March to May 2026, what share of treatment-arm enrolments actually saw the retention message?
  keys: []
  unit: share
  months:
  - 2026-03
  - 2026-05
  truth_sql: "SELECT AVG(CASE WHEN p.exposed THEN 1.0 ELSE 0.0 END) FILTER (WHERE p.arm = 'treatment') AS value\n\
    FROM truth_program p\nJOIN dim_customer d USING (customer_id)\nWHERE NOT d.is_test\n  AND p.campaign_month BETWEEN\
    \ '2026-03' AND '2026-05'\n"
  author_notes: Exposure rate within the treatment arm only. Control enrolments are excluded from the denominator.
- qid: B-H17
  set: B
  author: haiku
  lang: en
  question: For the March 2026 retention campaign, what was the churn rate among treatment-arm enrolments who saw
    the message versus those who did not? Give one share per group. Label the groups exposed = true and exposed
    = false.
  keys:
  - exposed
  unit: share
  months:
  - 2026-03
  - 2026-03
  truth_sql: "SELECT p.exposed AS exposed,\n       AVG(CASE WHEN p.churned THEN 1.0 ELSE 0.0 END) AS value\nFROM\
    \ truth_program p\nJOIN dim_customer d USING (customer_id)\nWHERE NOT d.is_test\n  AND p.arm = 'treatment'\n\
    \  AND p.campaign_month = '2026-03'\nGROUP BY p.exposed\nORDER BY p.exposed\n"
  author_notes: Churn in the campaign month, treatment arm only, split by actual exposure. This is a descriptive
    comparison, not the randomised effect. Output keys are false and true.
- qid: B-H18
  set: B
  author: haiku
  lang: zh
  question: 2026年2月，各渠道（自然、付费搜索、推荐）的流失率分别是多少？以小数表示，不是百分比。
  keys:
  - channel
  unit: share
  months:
  - 2026-02
  - 2026-02
  truth_sql: "SELECT d.channel AS channel,\n       AVG(CASE WHEN t.churned THEN 1.0 ELSE 0.0 END) AS value\nFROM\
    \ truth_customer_month t\nJOIN dim_customer d USING (customer_id)\nWHERE t.month = '2026-02' AND t.at_risk\n\
    GROUP BY d.channel\nORDER BY d.channel\n"
  author_notes: Official churn rate sliced by acquisition channel. This is one of three extra questions added to
    reach 20; the brief's mix sums to 17 (6 official, 8 derived, 3 program), so the remaining three are official-metric
    slices.
- qid: B-H19
  set: B
  author: haiku
  lang: en
  question: What was average monthly net revenue per region in 2025, in CNY?
  keys:
  - region
  unit: cny
  months:
  - 2025-01
  - 2025-12
  truth_sql: "SELECT region,\n       AVG(net_revenue_fen) / 100.0 AS value\nFROM truth_revenue\nWHERE month BETWEEN\
    \ '2025-01' AND '2025-12'\nGROUP BY region\nORDER BY region\n"
  author_notes: Average of the twelve monthly net revenue values per region, in CNY. Extra question beyond the mix;
    uses the same official net revenue definition.
- qid: B-H20
  set: B
  author: haiku
  lang: zh
  question: 2026年4月初，各地区的活跃订阅用户数分别是多少？
  keys:
