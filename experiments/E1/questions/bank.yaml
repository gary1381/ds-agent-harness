- qid: B-L18
  set: B
  author: luna
  lang: en
  question: 'For the March 2026 retention program, what was the intent-to-treat effect on churn as a share: control
    churn rate minus treatment churn rate?'
  keys: []
  unit: share
  months:
  - 2026-03
  - 2026-03
  truth_sql: "WITH rates AS (\n  SELECT p.arm,\n         SUM(CASE WHEN p.churned THEN 1 ELSE 0 END) * 1.0 / COUNT(*)\
    \ AS churn_rate\n  FROM truth_program p\n  JOIN dim_customer d USING (customer_id)\n  WHERE p.campaign_month\
    \ = '2026-03'\n    AND NOT d.is_test\n  GROUP BY p.arm\n)\nSELECT MAX(CASE WHEN arm = 'control' THEN churn_rate\
    \ END)\n         - MAX(CASE WHEN arm = 'treatment' THEN churn_rate END) AS value\nFROM rates\n"
