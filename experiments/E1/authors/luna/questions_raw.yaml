  notes: "Month-end activity is measured as activity at the start of the following month."
- id: q08
  lang: en
  question: "By what percent did net revenue change from January to February 2026? Use January as the baseline."
  keys: []
  unit: percent
  months: ["2026-01", "2026-02"]
  truth_sql: |
    WITH monthly AS (
      SELECT month, SUM(net_revenue_fen) AS revenue_fen
      FROM truth_revenue
      WHERE month IN ('2026-01', '2026-02')
      GROUP BY month
    )
    SELECT (MAX(CASE WHEN month = '2026-02' THEN revenue_fen END)
              - MAX(CASE WHEN month = '2026-01' THEN revenue_fen END))
             * 100.0
             / MAX(CASE WHEN month = '2026-01' THEN revenue_fen END) AS value
    FROM monthly
  notes: "Percentage change is (February minus January) divided by January, multiplied by 100."
- id: q09
  lang: en
  question: "What share of March 2026 net revenue came from each sales region? Report each share as a fraction from 0 to 1."
  keys: [region]
  unit: share
  months: ["2026-03", "2026-03"]
  truth_sql: |
    SELECT region,
           net_revenue_fen * 1.0
             / SUM(net_revenue_fen) OVER () AS value
    FROM truth_revenue
    WHERE month = '2026-03'
  notes: "Each region's share is its net revenue divided by total net revenue for March."
- id: q10
  lang: en
  question: "In April 2026, how many minutes did each plan's subscribers active at the start of the month watch on average per subscriber?"
  keys: [plan]
  unit: minutes
  months: ["2026-04", "2026-04"]
  truth_sql: |
    SELECT d.plan,
           SUM(m.minutes) * 1.0 / COUNT(DISTINCT m.customer_id) AS value
    FROM truth_customer_month m
    JOIN dim_customer d USING (customer_id)
    WHERE m.month = '2026-04'
      AND m.active_at_start
      AND NOT m.is_test
    GROUP BY d.plan
  notes: "Average uses minutes watched by non-test customers active at the start of April, divided by their distinct customer count."
