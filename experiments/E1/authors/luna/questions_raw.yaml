- id: q01
  lang: en
  question: "What was net revenue in February 2026, including add-ons and refunds, in CNY?"
  keys: []
  unit: cny
  months: ["2026-02", "2026-02"]
  truth_sql: |
    SELECT SUM(net_revenue_fen) / 100.0 AS value
    FROM truth_revenue
    WHERE month = '2026-02'
  notes: "Uses net revenue as booked in February; the source already excludes test accounts."
- id: q02
  lang: zh
  question: "2026年2月底，各销售区域有多少名活跃订阅用户？请按区域列出人数。"
  keys: [region]
  unit: count
  months: ["2026-02", "2026-02"]
  truth_sql: |
    SELECT d.region, COUNT(DISTINCT m.customer_id) AS value
    FROM truth_customer_month m
    JOIN dim_customer d USING (customer_id)
    WHERE m.month = '2026-03'
      AND m.active_at_start
      AND NOT m.is_test
    GROUP BY d.region
  notes: "月末活跃人数按次月月初活跃人数计算，并排除测试账户。"
- id: q03
  lang: en
  question: "What was the February 2026 churn rate for each plan, as a share from 0 to 1?"
  keys: [plan]
  unit: share
  months: ["2026-02", "2026-02"]
  truth_sql: |
    SELECT d.plan,
           SUM(CASE WHEN m.churned THEN 1 ELSE 0 END) * 1.0
             / COUNT(DISTINCT CASE WHEN m.at_risk THEN m.customer_id END) AS value
    FROM truth_customer_month m
    JOIN dim_customer d USING (customer_id)
    WHERE m.month = '2026-02'
      AND NOT m.is_test
    GROUP BY d.plan
  notes: "Churn rate is churned customers divided by non-test customers active at the start of the month."
- id: q04
  lang: en
  question: "What was March 2026 ARPU in fen per subscriber active at the start of the month?"
  keys: []
  unit: fen
  months: ["2026-03", "2026-03"]
  truth_sql: |
    SELECT SUM(r.net_revenue_fen) * 1.0
             / COUNT(DISTINCT CASE WHEN m.active_at_start THEN m.customer_id END) AS value
    FROM truth_revenue r
    CROSS JOIN truth_customer_month m
    WHERE r.month = '2026-03'
      AND m.month = '2026-03'
      AND NOT m.is_test
  notes: "Divides March net revenue by distinct non-test subscribers active at March start."
