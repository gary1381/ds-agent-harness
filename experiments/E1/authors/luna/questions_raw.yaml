- id: q07
  lang: en
  question: "How many non-test subscribers were active at the end of April 2026 in each plan?"
  keys: [plan]
  unit: count
  months: ["2026-04", "2026-04"]
  truth_sql: |
    SELECT d.plan, COUNT(DISTINCT m.customer_id) AS value
    FROM truth_customer_month m
    JOIN dim_customer d USING (customer_id)
    WHERE m.month = '2026-05'
      AND m.active_at_start
