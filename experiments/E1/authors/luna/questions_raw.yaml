  notes: "意向治疗流失率以每个随机分组中所有非测试入组用户为分母，不论是否看到消息。"
- id: q20
  lang: en
  question: "Across the March to May 2026 retention program campaigns combined, what was the intent-to-treat effect on churn as a share: control rate minus treatment rate?"
  keys: []
  unit: share
  months: ["2026-03", "2026-05"]
  truth_sql: |
    WITH rates AS (
      SELECT p.arm,
             SUM(CASE WHEN p.churned THEN 1 ELSE 0 END) * 1.0 / COUNT(*) AS churn_rate
      FROM truth_program p
      JOIN dim_customer d USING (customer_id)
      WHERE p.campaign_month BETWEEN '2026-03' AND '2026-05'
        AND NOT d.is_test
      GROUP BY p.arm
    )
    SELECT MAX(CASE WHEN arm = 'control' THEN churn_rate END)
             - MAX(CASE WHEN arm = 'treatment' THEN churn_rate END) AS value
    FROM rates
  notes: "Pools enrollments across the three campaign months by arm and counts churn regardless of exposure."