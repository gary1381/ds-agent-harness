[project]
name = "dsharness"
version = "0.1.0"
description = "DS Harness: a verifiable harness that lets any AI agent do data science & data engineering work with evidence"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5,<2",
  "pandas>=2.2",
  "pyarrow>=20",
  "numpy>=2.0",
  "scipy>=1.13",
  "scikit-learn>=1.6",
  "pandera>=0.30",
  "sqlglot>=30",
  "pyyaml>=6",
  "mcp>=2.3,<3",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100"]
external = ["openpyxl>=3.1"]   # only for examples/online_retail (reads the UCI xlsx)

[project.scripts]
dsh = "dsharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
