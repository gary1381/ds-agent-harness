<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" font-family="system-ui, sans-serif" font-size="13"><rect width="760" height="276" fill="#fcfcfb"/>
<text x="16" y="28" font-size="16" font-weight="600" fill="#1f1f1d">Which metric does a fresh question name? 160 paraphrases by a model that never saw the terms</text>
<text x="16" y="48" fill="#5c5b57">Set 3 (no overlap with the two sets used to edit the terms); English and Chinese, 8 each per metric, 10 metrics</text>
<rect x="16" y="62" width="12" height="12" rx="2" fill="#2a78d6"/><text x="34" y="72" fill="#3b3a37">resolves to its own metric</text>
<rect x="240" y="62" width="12" height="12" rx="2" fill="#eb6834"/><text x="258" y="72" fill="#3b3a37">another metric: false-hold risk</text>
<rect x="499" y="62" width="12" height="12" rx="2" fill="#c9c8c2"/><text x="517" y="72" fill="#3b3a37">no metric: not checked</text>
<text x="220" y="111.0" text-anchor="end" fill="#1f1f1d">Frozen E3a terms</text>
