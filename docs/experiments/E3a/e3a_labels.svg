<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="16" y="20" font-size="12" fill="#52514e">Wrong attempts by primary error label (designer). Hatched part: the harness itself caused the error (exploratory tag).</text><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#fcfcfb" stroke-width="2"/></pattern></defs><rect x="16" y="30" width="10" height="10" rx="2" fill="#2a78d6"/><text x="31" y="39" font-size="11" fill="#0b0b0b">N: no harness</text><rect x="130" y="30" width="10" height="10" rx="2" fill="#eb6834"/><text x="145" y="39" font-size="11" fill="#0b0b0b">H: harness v0.3</text><rect x="230" y="30" width="10" height="10" rx="2" fill="#eb6834"/><rect x="230" y="30" width="10" height="10" fill="url(#hatch)"/><text x="245" y="39" font-size="11" fill="#0b0b0b">H, caused by the harness</text><text x="112" y="78" font-size="12" fill="#0b0b0b" text-anchor="end">E-def</text><rect x="120" y="76" width="26.7" height="10" rx="2" fill="#eb6834"/><rect x="120" y="76" width="26.7" height="10" fill="url(#hatch)"/><text x="150.7" y="85" font-size="10" fill="#0b0b0b">1</text><text x="112" y="108" font-size="12" fill="#0b0b0b" text-anchor="end">E-test</text><rect x="120" y="106" width="53.3" height="10" rx="2" fill="#eb6834"/><text x="177.3" y="115" font-size="10" fill="#0b0b0b">2</text><text x="112" y="138" font-size="12" fill="#0b0b0b" text-anchor="end">E-refund</text><rect x="120" y="124" width="133.3" height="10" rx="2" fill="#2a78d6"/><text x="257.3" y="133" font-size="10" fill="#0b0b0b">5</text><text x="112" y="168" font-size="12" fill="#0b0b0b" text-anchor="end">E-calc</text><rect x="120" y="154" width="160.0" height="10" rx="2" fill="#2a78d6"/><text x="284.0" y="163" font-size="10" fill="#0b0b0b">6</text><text x="112" y="198