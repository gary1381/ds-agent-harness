<text x="30" y="832" font-size="10" font-weight="400" fill="#6b7280" text-anchor="start">E1 合成世界 → E1b → E2 自用 → E3a/E4 真实零售 → E3d 管道 → E3c 实验读数 → E3b 预测 → E5 覆盖检查    E1 synthetic → E1b → E2 dogfood → E3a/E4 retail → E3d pipeline → E3c experiment → E3b forecast → E5 coverage</text>
