<text x="900" y="696" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">每次 API 调用记入花费账本</text>
<text x="900" y="713" font-size="11.5" font-weight="400" fill="#374151" text-anchor="start">spend ledger outside the repo</text>
