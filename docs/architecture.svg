<text x="912" y="379" font-size="11" font-weight="400" fill="#374151" text-anchor="start">Luna + Haiku 双标，Terra 盲裁</text>
<text x="912" y="396" font-size="11" font-weight="400" fill="#374151" text-anchor="start">two labellers; Terra adjudicates</text>
