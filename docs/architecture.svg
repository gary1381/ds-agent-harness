<text x="676" y="643" font-size="10.5" font-weight="400" fill="#92400e" text-anchor="start">认证表 certified</text>
<text x="44" y="676" font-size="11" font-weight="400" fill="#78350f" text-anchor="start">dbt · Great Expectations · DuckDB ｜ 合成世界 + 公开真实数据 / synthetic world + public data（UCI Online Retail II、NYC TLC、Hillstrom）</text>
