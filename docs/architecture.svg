<text x="460" y="467" font-size="11" font-weight="400" fill="#374151" text-anchor="start">审批（禁止自审）approvals</text>
<text x="460" y="484" font-size="11" font-weight="400" fill="#374151" text-anchor="start">回测 backtest</text>
<rect x="653" y="398" width="191" height="110" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
